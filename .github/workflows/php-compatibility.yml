name: PHP compatibility

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.0'
          - '8.3'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | sort -z \
            | xargs -0 -n1 php -l


  wordpress-runtime:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.4'
            php: '8.0'
          - wordpress: '7.1'
            php: '8.3'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli

      - name: Install verified WP-CLI 2.12.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output /tmp/wp-cli.phar \
            https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  /tmp/wp-cli.phar' | sha256sum --check --strict

      - name: Create clean WordPress runtime and activate plugin
        shell: bash
        run: |
          set -euo pipefail
          runtime=/tmp/plugin-runtime
          plugin_dir="$runtime/wp-content/plugins/ai-patch-runner"
          rm -rf "$runtime"
          php /tmp/wp-cli.phar core download --path="$runtime" --version='${{ matrix.wordpress }}' --locale=en_US --force
          php /tmp/wp-cli.phar config create --path="$runtime" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
          php /tmp/wp-cli.phar config set WP_DEBUG true --raw --path="$runtime"
          php /tmp/wp-cli.phar config set WP_DEBUG_LOG true --raw --path="$runtime"
          php /tmp/wp-cli.phar core install \
            --path="$runtime" \
            --url=http://plugin-runtime.test \
            --title='AI Patch Runner Runtime' \
            --admin_user=admin \
            --admin_password='runtime-only-password' \
            --admin_email=runtime@example.invalid \
            --skip-email
          mkdir -p "$plugin_dir"
          rsync -a --exclude='.git/' "$GITHUB_WORKSPACE/" "$plugin_dir/"
          rm -f "$runtime/wp-content/debug.log"
          php /tmp/wp-cli.phar plugin activate ai-patch-runner --path="$runtime"
          php /tmp/wp-cli.phar plugin status ai-patch-runner --path="$runtime"
          php /tmp/wp-cli.phar plugin deactivate ai-patch-runner --path="$runtime"
          php /tmp/wp-cli.phar plugin activate ai-patch-runner --path="$runtime"

      - name: Reject runtime PHP errors
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log=/tmp/plugin-runtime/wp-content/debug.log
          if [[ -f "$log" ]] && grep -Eqi 'PHP (Fatal error|Parse error|Warning|Deprecated|Notice)' "$log"; then
            cat "$log"
            exit 1
          fi
